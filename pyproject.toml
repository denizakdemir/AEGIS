[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-causal-monitor"
version = "0.1.0"
description = "Fast causal gap monitoring proxies aligned with Le Cam deficiency theory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Deniz Akdemir", email = "deniz.akdemir.work@gmail.com" }]
keywords = [
  "causal-inference",
  "monitoring",
  "le-cam-deficiency",
  "safety",
  "ml-ops",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/denizakdemir/AEGIS"
Repository = "https://github.com/denizakdemir/AEGIS"
Issues = "https://github.com/denizakdemir/AEGIS/issues"
Changelog = "https://github.com/denizakdemir/AEGIS/blob/main/CHANGELOG.md"

dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
real-data = [
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "datasets>=2.14",
  "folktables>=0.0.12",
  "causaldata>=0.1.3",
]
dev = ["pytest>=8.0"]
plots = ["matplotlib>=3.7"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
